name: Build Packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_RUNTIME_VERSION: 22.23.1

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-UI contract tests
        run: npm test

  macos:
    name: macOS ${{ matrix.architecture }} DMG
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Download official Node.js runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/node-runtimes
          cd build/node-runtimes
          base="https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}"
          curl -fL --retry 3 -O "${base}/SHASUMS256.txt"
          archive="node-v${NODE_RUNTIME_VERSION}-darwin-${{ matrix.architecture }}.tar.gz"
          curl -fL --retry 3 -O "${base}/${archive}"
          grep " ${archive}$" SHASUMS256.txt | shasum -a 256 -c -
          tar -xzf "${archive}"

      - name: Build native injector
        shell: bash
        run: |
          set -euo pipefail
          npm run build:sea -- \
            --node-binary "build/node-runtimes/node-v${NODE_RUNTIME_VERSION}-darwin-${{ matrix.architecture }}/bin/node" \
            --output "build/native/Codex Quota Injector-${{ matrix.architecture }}"

      - name: Package architecture DMG
        shell: bash
        run: |
          set -euo pipefail
          npm run package:macos -- \
            --architecture "${{ matrix.architecture }}" \
            --input-executable "build/native/Codex Quota Injector-${{ matrix.architecture }}" \
            --node-license "build/node-runtimes/node-v${NODE_RUNTIME_VERSION}-darwin-${{ matrix.architecture }}/LICENSE" \
            --output-dir "release/macos-${{ matrix.architecture }}"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-injector-macos-${{ matrix.architecture }}
          retention-days: 30
          if-no-files-found: error
          path: release/macos-${{ matrix.architecture }}/*.dmg

  wsl-relay:
    name: WSL x64 Relay
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Download official Linux Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/node-runtimes
          cd build/node-runtimes
          base="https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}"
          archive="node-v${NODE_RUNTIME_VERSION}-linux-x64.tar.xz"
          curl -fL --retry 3 -O "${base}/SHASUMS256.txt"
          curl -fL --retry 3 -O "${base}/${archive}"
          grep " ${archive}$" SHASUMS256.txt | sha256sum -c -
          tar -xJf "${archive}"

      - name: Build native WSL relay
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          node scripts/build-wsl-relay.mjs \
            --node-binary "build/node-runtimes/node-v${NODE_RUNTIME_VERSION}-linux-x64/bin/node" \
            --output "build/native/codex-quota-relay-wsl-${package_version}"

      - name: Upload WSL relay for Windows packaging
        uses: actions/upload-artifact@v4
        with:
          name: wsl-relay-intermediate
          retention-days: 1
          if-no-files-found: error
          path: build/native/codex-quota-relay-wsl-*

  windows:
    name: Windows x64 Setup
    needs:
      - test
      - wsl-relay
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Download prebuilt WSL relay
        uses: actions/download-artifact@v4
        with:
          name: wsl-relay-intermediate
          path: build/native

      - name: Download official Node.js runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://nodejs.org/dist/v$env:NODE_RUNTIME_VERSION"
          $archive = "node-v$env:NODE_RUNTIME_VERSION-win-x64.zip"
          New-Item -ItemType Directory -Force -Path "build/node-runtimes" | Out-Null
          Invoke-WebRequest "$base/SHASUMS256.txt" -OutFile "build/node-runtimes/SHASUMS256.txt"
          Invoke-WebRequest "$base/$archive" -OutFile "build/node-runtimes/$archive"
          $line = Select-String -Path "build/node-runtimes/SHASUMS256.txt" -Pattern " $archive$" | Select-Object -First 1
          if (-not $line) { throw "Node.js checksum not found" }
          $expected = ($line.Line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "build/node-runtimes/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Node.js checksum mismatch" }
          Expand-Archive "build/node-runtimes/$archive" -DestinationPath "build/node-runtimes" -Force

      - name: Build background executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build:sea -- `
            --node-binary "build/node-runtimes/node-v$env:NODE_RUNTIME_VERSION-win-x64/node.exe" `
            --output "build/native/Codex Quota Injector.exe"

      - name: Build dedicated native Windows relay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = (& node -p "require('./package.json').version").Trim()
          npm run build:relay:windows -- `
            --node "build/node-runtimes/node-v$env:NODE_RUNTIME_VERSION-win-x64/node.exe" `
            --output "build/native/codex-quota-relay-windows-$packageVersion.exe"

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $makensisPath = $null
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $candidatePaths = @(
            (Join-Path $programFilesX86 "NSIS\makensis.exe"),
            (Join-Path $env:ProgramFiles "NSIS\makensis.exe")
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis --yes --no-progress
            $chocoExitCode = $LASTEXITCODE

            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($chocoExitCode -eq 0 -and $command) {
              $makensisPath = $command.Source
              break
            }

            $makensisPath = $candidatePaths |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
            if ($makensisPath) { break }

            if ($attempt -lt 3) {
              Start-Sleep -Seconds ($attempt * 10)
            }
          }

          if (-not $makensisPath) {
            throw "NSIS 安装失败或找不到 makensis.exe"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "MAKENSIS_PATH=$makensisPath"
          Write-Host "Using NSIS compiler: $makensisPath"

      - name: Package Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:MAKENSIS_PATH -or -not (Test-Path -LiteralPath $env:MAKENSIS_PATH)) {
            throw "MAKENSIS_PATH 未设置或文件不存在"
          }
          $packageVersion = (& node -p "require('./package.json').version").Trim()
          npm run package:windows -- `
            --input-executable "build/native/Codex Quota Injector.exe" `
            --windows-relay-executable "build/native/codex-quota-relay-windows-$packageVersion.exe" `
            --wsl-relay-executable "build/native/codex-quota-relay-wsl-$packageVersion" `
            --node-license "build/node-runtimes/node-v$env:NODE_RUNTIME_VERSION-win-x64/LICENSE" `
            --output-dir "release/windows" `
            --makensis "$env:MAKENSIS_PATH"

      - name: Smoke test Windows install and dedicated relay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = (& node -p "require('./package.json').version").Trim()
          $setup = (Resolve-Path "release/windows/Codex-Quota-Injector-$packageVersion-windows-x64-Setup.exe").Path
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\Codex Quota Injector"
          $install = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Windows Setup exited with $($install.ExitCode)" }

          $main = Join-Path $installRoot "Codex Quota Injector.exe"
          $relay = Join-Path $installRoot "relay\codex-quota-relay-windows-$packageVersion.exe"
          $wslRelay = Join-Path $installRoot "relay\codex-quota-relay-wsl-$packageVersion"
          foreach ($path in @($main, $relay, $wslRelay)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing installed artifact: $path" }
          }

          $configRoot = Join-Path $env:APPDATA "Codex Quota Injector"
          New-Item -ItemType Directory -Force -Path $configRoot | Out-Null
          $node = (Get-Command node.exe).Source
          @{ upstreamExecutable = $node } |
            ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $configRoot "app-server-relay-config.json") -Encoding utf8
          $probe = Join-Path $env:RUNNER_TEMP "windows-relay-probe.mjs"
          @'
          process.stdout.write(JSON.stringify({
            args: process.argv.slice(2),
            cliPath: process.env.CODEX_CLI_PATH ?? null,
            role: process.env.CODEX_QUOTA_ROLE ?? null,
            config: process.env.CODEX_QUOTA_RELAY_CONFIG ?? null,
            native: process.env.CODEX_QUOTA_WINDOWS_NATIVE ?? null,
          }));
          '@ | Set-Content -LiteralPath $probe -Encoding utf8
          $env:CODEX_QUOTA_ROLE = "stale-parent-value"
          Remove-Item Env:CODEX_QUOTA_RELAY_CONFIG -ErrorAction SilentlyContinue
          $observed = (& $relay $probe probe | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Dedicated relay exited with $LASTEXITCODE" }
          if (($observed.args -join ',') -ne "probe" -or $observed.cliPath -ne $node -or
              $observed.role -or $observed.config -or $observed.native) {
            throw "Dedicated relay did not recover or clear its native configuration"
          }

          $reinstall = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw "Same-version reinstall exited with $($reinstall.ExitCode)" }
          foreach ($path in @($main, $relay, $wslRelay)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Same-version reinstall removed artifact: $path" }
          }
          $uninstaller = Join-Path $installRoot "Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Windows uninstall exited with $($uninstall.ExitCode)" }
          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(10)
          while ((Test-Path -LiteralPath $main) -and [DateTime]::UtcNow -lt $uninstallDeadline) {
            Start-Sleep -Milliseconds 200
          }
          if (Test-Path -LiteralPath $main) { throw "Windows uninstall left the main executable behind" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-injector-windows
          retention-days: 30
          if-no-files-found: error
          path: release/windows/*.exe

  release:
    name: Publish release
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: codex-quota-injector-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          release_tag="v${package_version}"
          release_title="Codex Quota Injector ${package_version}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "Release tag must match package.json: ${release_tag}" >&2
            exit 1
          fi

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${release_tag}" release-assets/* \
              --generate-notes \
              --latest \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
